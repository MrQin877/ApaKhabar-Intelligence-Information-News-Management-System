# Always use with compose.yaml for isolated Phase 2B/2C tests. Blocks outbound traffic.
x-test-env: &test-env
  MAIL_MAILER: log
  DB_QUEUE_TABLE: phase2b_jobs
  APP_DEBUG: "false"
  FACEBOOK_APP_SECRET: ""
  FACEBOOK_PAGE_ACCESS_TOKEN: ""
  INSTAGRAM_ACCESS_TOKEN: ""
  CLOUDINARY_API_KEY: ""
  CLOUDINARY_API_SECRET: ""
  OPENAI_API_KEY: ""
  WHAPI_TOKEN: ""
  BULK360_APP_KEY: ""
  BULK360_APP_SECRET: ""

services:
  db:
    restart: "no"
    command: ["--event-scheduler=OFF"]
    mem_limit: 768m
  app:
    environment: *test-env
    restart: "no"
    mem_limit: 768m
  web:
    restart: "no"
    mem_limit: 128m
    networks: [internal, test-ingress]
  ai:
    environment:
      EVALUATOR_ENABLED: "false"
      LANGCHAIN_TRACING_V2: "false"
      WEB_SEARCH_URL: ""
      ANONYMIZED_TELEMETRY: "false"
    restart: "no"
    mem_limit: 1g
  llama-writer:
    command: ["-m", "/models/writer.gguf", "--alias", "apakhabar-gemma", "--host", "0.0.0.0", "--port", "8080", "--ctx-size", "1024", "--parallel", "1", "--jinja", "--reasoning", "off", "--n-gpu-layers", "0", "--threads", "4", "--batch-size", "128", "--ubatch-size", "128"]
    restart: "no"
    mem_limit: 4g
    cpus: 6
  ollama:
    environment:
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_KEEP_ALIVE: "30s"
    mem_limit: 2g
    cpus: 4
    restart: "no"
  worker-documents:
    image: apakhabar-docker-app:latest
    environment: *test-env
    restart: "no"
    mem_limit: 768m
  worker-generation:
    image: apakhabar-docker-app:latest
    environment: *test-env
    restart: "no"
  worker-video:
    image: apakhabar-docker-app:latest
    environment: *test-env
    restart: "no"
  scheduler:
    environment: *test-env
    restart: "no"

networks:
  internal:
    internal: true
  test-ingress:
